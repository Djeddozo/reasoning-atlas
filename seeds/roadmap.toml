# Starting roadmap, loaded by `hq init --seed`. Dates assume a start on Sat 10 Oct 2026
# and roughly 4–6 hours a week alongside school and work. Shift them freely; HQ re-ranks.
# `after` lists keys of tasks that must be done first.

[[goals]]
key = "g_hq"
title = "HQ runs on its own and tells me what to do next"
horizon = "quarter"
why = "Foundation for everything else: a system that keeps going while I'm at school."

[[goals]]
key = "g_voice"
title = "Run HQ from my phone by voice, no typing"
horizon = "quarter"
why = "Speed: the gap between thinking something and HQ acting on it should be seconds."

[[goals]]
key = "g_grow"
title = "HQ finds and proposes opportunities and new skills by itself"
horizon = "year"
why = "Compounding: every project and skill makes the next one faster."

